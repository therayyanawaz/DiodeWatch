name: Feature request
description: Propose a channel, a surface, or a piece of evidence the project should produce.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The project has one hard constraint and one house rule, and a proposal is
        judged against both: **it must work passively over one-way traffic**
        (nothing can be sent back, nothing decrypted), and **it must be able to
        prove what it claims** on data the repository can obtain.
  - type: textarea
    id: problem
    attributes:
      label: The analyst problem
      description: Who is stuck, on what evidence, and why the current pipeline cannot help them.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The signal, the data it needs, and where in the pipeline it belongs.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Ingestion / features
        - Rule or window channel
        - ML channel
        - Alerts, evidence chain or exports
        - Frontend (React wall)
        - Backend (mission-control)
        - DevOps / CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How it would be evaluated, and what would make you withdraw it
      description: >
        Name the corpus, the metric and the threshold before the first run — the
        repo's evaluation protocol fixes gates up front, and a channel that cannot
        meet its gate is expected to disable itself rather than emit guesses.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you considered and rejected
