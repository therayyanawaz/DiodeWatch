name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.6

      - name: Lint (ruff)
        run: python -m ruff check src/ scripts/ tests/ apps/ waf/

      - name: Parse the mission-control UI
        # pytest covers the API and asset paths, not the JS: a syntax error in
        # the wall's own code ships a blank dashboard and CI never sees it.
        run: |
          for f in apps/mission_control/static/js/*.js; do node --check "$f"; done

      - name: Set up Node 22
        # Pinned to the version that produced the committed bundle, so the
        # rebuild below hashes to the same filename it already has.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild the React wall and prove the committed bundle is current
        # apps/mission_control/static/ carries the build output so the offline
        # launch asks nothing of the host. That is also the only way a bundle
        # can drift from its source unnoticed, so CI builds frontend/ and
        # requires the shipped output to be byte-identical to what is in the
        # tree. The hand-written css/ and js/ beside it are not emitted by the
        # build, so they can only differ by an edit that never got committed.
        run: |
          (cd frontend && npm ci && npm run build)
          git diff --exit-code -- apps/mission_control/static

      - name: Claim guardrail (phrasing, metrics, scope, test counts, commands)
        run: python -m scripts.checks.check_claims

      - name: Generate synthetic demo pack (offline, deterministic)
        run: python scripts/generators/make_demo_pack.py

      - name: Restore pinned evaluation artifacts (models + metric JSONs)
        run: |
          mkdir -p models results/ml
          cp docs/evaluation/models/*.joblib models/
          cp docs/evaluation/runs/*_metrics.json results/ml/

      - name: Test suite (pytest)
        run: python -m pytest tests/ -q

      - name: Clock checks on a non-UTC host
        # Both of the wall's clocks key off the host zone, and this runner is
        # UTC so neither can fail here by accident. The timeline keys its
        # buckets by epoch second from naive-UTC timestamps, and the feed
        # formats capture times written two different ways by two producers;
        # read as host-local, each shifts by the machine's offset (5h30m on
        # IST) — which is exactly what a judge's laptop will do.
        env:
          TZ: Asia/Kolkata
        run: |
          python -m pytest tests/ -q -k timeline
          node scripts/checks/check_timefmt.mjs

      - name: Demo rehearsal (the launcher's own pre-flight)
        run: python scripts/checks/rehearse_demo.py
