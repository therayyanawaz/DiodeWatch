name: CI

# The workflow reads the tree and nothing else: no step writes to the API, so
# the token is scoped to the one permission every step actually needs.
permissions:
  contents: read

# A pushed fix should not queue behind the run it supersedes. Pull requests
# cancel in flight; a push to main is allowed to finish, because that run is the
# record the badge and the branch protection read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.6

      - name: Lint (ruff)
        run: python -m ruff check src/ scripts/ tests/ apps/ waf/

      - name: Parse the mission-control UI
        # pytest covers the API and asset paths, not the JS: a syntax error in
        # the wall's own code ships a blank dashboard and CI never sees it.
        run: |
          for f in apps/mission_control/static/js/*.js; do node --check "$f"; done

      - name: Set up Node 22
        # Pinned to the version that produced the committed bundle, so the
        # rebuild below hashes to the same filename it already has.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild the React wall and prove the committed bundle is current
        # apps/mission_control/static/ carries the build output so the offline
        # launch asks nothing of the host. That is also the only way a bundle
        # can drift from its source unnoticed, so CI builds frontend/ and
        # requires the shipped output to be byte-identical to what is in the
        # tree. The hand-written css/ and js/ beside it are not emitted by the
        # build, so they can only differ by an edit that never got committed.
        run: |
          (cd frontend && npm ci && npm run build)
          git diff --exit-code -- apps/mission_control/static

      - name: Emit the SBOM (CycloneDX 1.5, offline)
        # Generated, not curated: the file lists what this environment actually
        # installed, and the artifact is what a reviewer scans for known-bad
        # versions. Deterministic output, so a diff means a dependency moved.
        run: python scripts/checks/make_sbom.py --out sbom.cdx.json

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Check the dependency lock (offline)
        # requirements.txt keeps its floors so CI resolves fresh and catches a
        # broken dependency on the day it breaks; requirements.lock pins the
        # verified run for a host that has to come up identically twice. The
        # check is structural and offline, so it cannot flake on the index.
        run: python scripts/checks/make_lock.py --check

      - name: Claim guardrail (phrasing, metrics, scope, test counts, commands)
        run: python -m scripts.checks.check_claims

      - name: Generate synthetic demo pack (offline, deterministic)
        # Both artifacts are generated, not committed: the flow table the demo
        # replays, and the capture the reference-IDS measurement runs over.
        run: |
          python scripts/generators/make_demo_pack.py
          python scripts/generators/make_demo_pcap.py

      - name: Restore pinned evaluation artifacts (models + metric JSONs)
        run: |
          mkdir -p models results/ml
          cp docs/evaluation/models/*.joblib models/
          cp docs/evaluation/runs/*_metrics.json results/ml/

      - name: Test suite (pytest)
        # --cov is the gate, not a report: [tool.coverage.report] fail_under is a
        # floor, so a new route or detector with no test fails the build instead
        # of shipping quietly.
        run: python -m pytest tests/ -q --cov=src --cov-report=term-missing:skip-covered

      - name: Clock checks on a non-UTC host
        # Both of the wall's clocks key off the host zone, and this runner is
        # UTC so neither can fail here by accident. The timeline keys its
        # buckets by epoch second from naive-UTC timestamps, and the feed
        # formats capture times written two different ways by two producers;
        # read as host-local, each shifts by the machine's offset (5h30m on
        # IST), which is exactly what a judge's laptop will do.
        env:
          TZ: Asia/Kolkata
        run: |
          python -m pytest tests/ -q -k timeline
          node scripts/checks/check_timefmt.mjs

      - name: Demo rehearsal (the launcher's own pre-flight)
        run: python scripts/checks/rehearse_demo.py
