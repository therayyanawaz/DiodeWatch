# DiodeWatch mission-control wall: TLS termination and a single upstream.
# Install as /etc/nginx/conf.d/diodewatch.conf, then `nginx -t`.
#
# This file terminates TLS; it does not authenticate the caller. Keep the
# listener on a trusted management network until the wall has an
# authentication story (see docs/deployment.md).

# The query string can carry the wall token on /ws/live?token=..., so the
# access log records $uri, never $request_uri or $args.
log_format diodewatch '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/diodewatch.access.log diodewatch;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/diodewatch/tls/fullchain.pem;
    ssl_certificate_key /etc/diodewatch/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:DIODEWATCH:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The application caps alert export volume; this is transport hygiene,
    # not the request-size policy planned for the wall itself.
    client_max_body_size 1m;

    access_log /var/log/nginx/diodewatch.access.log diodewatch;

    location / {
        proxy_pass http://127.0.0.1:8530;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header Server;
    }
}
