[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diodewatch"
version = "1.0.0"
description = "Passive AI threat detection for one-way (data-diode) network links"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Dikshita Konwar", email = "204498859+itsdikshitaa@users.noreply.github.com" },
    { name = "Md Rayyan Nawaz", email = "133018976+therayyanawaz@users.noreply.github.com" },
    { name = "Prateek Dagar", email = "346844492+sandy1523@users.noreply.github.com" },
    { name = "Aayush", email = "150200659+Aayush0024@users.noreply.github.com" },
    { name = "Deependra", email = "152956315+deependra3647@users.noreply.github.com" },
    { name = "Kuldeep Sharma", email = "197244663+kuldeep265@users.noreply.github.com" },
]
maintainers = [
    { name = "Md Rayyan Nawaz", email = "133018976+therayyanawaz@users.noreply.github.com" },
]
keywords = ["network intrusion detection", "data diode", "unidirectional network",
            "passive monitoring", "threat detection", "stix"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
# Runtime dependencies stay single-sourced in requirements.txt (also consumed
# verbatim by CI and the air-gapped wheelhouse build).
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/therayyanawaz/DiodeWatch"
Repository = "https://github.com/therayyanawaz/DiodeWatch"
Issues = "https://github.com/therayyanawaz/DiodeWatch/issues"
Changelog = "https://github.com/therayyanawaz/DiodeWatch/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# The codebase's import contract is the `src.`-prefixed namespace
# (`from src.alerts.schema import Alert`), so `src` itself is the distributed
# package, NOT a src-layout root (that would strip the prefix and expose
# generic top-level names like `alerts`).
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The suite is the only thing that proves a detector still detects, so it has to
# fail when new code arrives untested. The floor is deliberately below the
# measured figure (81 percent at 1.0.0): a refactor may move a few lines without
# a test, an entire new detector may not.
[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
fail_under = 78
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
