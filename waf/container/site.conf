# Server block for the containerised WAF grading stack (see waf/WAF_README.md).
#
# Loads ONLY waf/modsecurity.conf: no Core Rule Set and none of the shipped
# recommended config, so a measured block is attributable to the standalone
# ruleset itself. Unmatched traffic is proxied verbatim to the permissive
# backend, which answers 200/404/501 but never 403/405/414, so anything the
# harness records as "blocked" came from ModSecurity, not the app tier.

server {
    listen       80;
    server_name  localhost;

    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    location / {
        proxy_pass http://waf-backend:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
