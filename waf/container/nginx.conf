# Main nginx context for the containerised WAF grading stack.
#
# The ModSecurity v3 connector ships as a DYNAMIC module in the
# owasp/modsecurity:nginx-alpine image, so it must be loaded here before
# `modsecurity on` can be used in a server block.

load_module modules/ngx_http_modsecurity_module.so;

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    sendfile    on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
