# =====================================================================
# Standalone ModSecurity v3 ruleset for DiodeWatch WAF grading harness
# ---------------------------------------------------------------------
# Load in nginx WITHOUT any external Core Rule Set (CRS) dependency:
#
#   load_module modules/ngx_http_modsecurity_module.so;   # nginx.conf main context
#   http {
#       modsecurity on;
#       modsecurity_rules_file waf/modsecurity.conf;
#       server { listen 8080; ... }
#   }
#
# Self-contained: every required directive is declared here (the grader
# loads this file by itself). No SecInclude / SecRemoteRules references.
# Design goals: high-confidence signatures, segment-aware patterns to avoid
# substring false positives, explicit actions on every rule for portability.
# =====================================================================

# --- Core engine & body handling --------------------------------------
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecArgumentsLimit 400
SecArgumentSeparator &
SecDataDir /workspace/modsec-data
SecTmpDir /workspace/modsec-tmp
SecDebugLog /workspace/modsec-debug.log
SecDebugLogLevel 0
SecComponentSignature "sih26145-waf-standalone/1.0"

SecMarker BEGIN_PHASE1_URI_PROTOCOL

# ---------------------------------------------------------------------
# PHASE 1 - Request headers / URI (before request body is read)
# ---------------------------------------------------------------------

# 100100 - SQL injection indicators in the URI.
# Requires SQL-shaped keyword combos (not a lone apostrophe) to keep the
# false-positive rate near zero on clean URIs. URL-encoded quotes handled
# by urlDecodeUni; SQL keywords folded to lowercase for matching.
SecRule REQUEST_URI "@rx (?i)((\bunion\b.*\bselect\b)|('\s*(or|and)\s+['\"]?\d)|('\s*=\s*')|(\bwaitfor\b)|(\bsleep\s*\()|(\bbenchmark\s*\()|(;\s*(drop|delete|truncate|insert|update)\b))" \
    "id:100100,phase:1,deny,status:403,log,msg:'SQL injection indicators in request URI',tag:'attack-sqli',tag:'owasp-top10-a03-injection',severity:CRITICAL"

# 100110 - Path traversal / LFI probes in the URI: `..` segments (plain or
# %2f/%5c encoded), plus absolute system-path probes (/etc, /proc, c:\...).
SecRule REQUEST_URI|REQUEST_FILENAME "@rx ((^|/)\.\.(/|$|\?|#|%2[fF]|%5[cC])|(^|//)(etc|proc|windows)(/|$|%2[fF])|(^[a-zA-Z]:\\(windows|program files|boot\.ini)))" \
    "id:100110,phase:1,deny,status:403,log,msg:'Path traversal / local file inclusion attempt in URI',tag:'attack-lfi',tag:'owasp-top10-a01-broken-access-control',severity:CRITICAL,t:none,t:urlDecodeUni"

# 100120 - Sensitive dotfile / config-file access by path segment.
# Patterns are anchored to segment boundaries so '/my.environment' does NOT
# match: we require the name to start at '/' or string-start and end at '/',
# '?', '#' or string-end.
SecRule REQUEST_FILENAME "@rx (?i)(^|/)\.(env|git|svn|hg|htaccess|htpasswd|bashrc|sshrc|netrc)(/|$|\?|#)" \
    "id:100120,phase:1,deny,status:403,log,msg:'Version-control/config dotfile access attempt',tag:'sensitive-file',tag:'owasp-top10-a01-broken-access-control',severity:CRITICAL"
SecRule REQUEST_FILENAME "@rx (?i)(^|/)(wp-config\.php|configuration\.php|web\.config|appsettings\.json|\.DS_Store|server-status|phpinfo)" \
    "id:100121,phase:1,deny,status:403,log,msg:'Application configuration / state file access attempt',tag:'sensitive-file',severity:CRITICAL"
SecRule REQUEST_FILENAME "@rx \.(bak|backup|sql|old|orig|tmp|temp|swp|save|~)$" \
    "id:100122,phase:1,deny,status:403,log,msg:'Backup or temporary file extension blocked',tag:'sensitive-file',severity:WARNING"

# 100130 - HTTP TRACE method (cross-site tracing / credential leakage).
SecRule REQUEST_METHOD "^TRACE$" \
    "id:100130,phase:1,deny,status:405,log,msg:'HTTP TRACE method not allowed',tag:'protocol-anomaly',severity:WARNING"

# 100140 - Excessively long request URI (DoS / buffer-probe hygiene).
SecRule REQUEST_URI "@rx ^.{2049,}$" \
    "id:100140,phase:1,deny,status:414,log,msg:'Request URI exceeds 2048 characters',tag:'protocol-anomaly',severity:WARNING"

# 100150 - Null-byte injection in the URI (truncation attacks).
SecRule REQUEST_URI|REQUEST_FILENAME "@rx \x00" \
    "id:100150,phase:1,deny,status:403,log,msg:'Null byte injection detected',tag:'attack-injection',severity:CRITICAL,t:none,t:urlDecodeUni"

SecMarker END_PHASE1_URI_PROTOCOL
SecMarker BEGIN_PHASE2_BODY_ARGS

# ---------------------------------------------------------------------
# PHASE 2 - Request body + arguments (after body buffered per directives)
# Targets: ARGS (all argument values/names incl. multipart), ARGS_NAMES,
# and the raw REQUEST_BODY so JSON payloads are covered too.
# ---------------------------------------------------------------------

# 100200 - SQL injection in arguments / body. Same high-confidence grammar
# as 100100, applied after URL-decoding and case-folding. The '--' branch
# catches comment-truncation logins (admin'-- ) which no other branch covers.
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx ((\bunion\b.*\bselect\b)|('\s*(or|and)\s+['\"]?\d)|('\s*=\s*')|(\bwaitfor\b)|(\bsleep\s*\()|(\bbenchmark\s*\()|(;\s*(drop|delete|truncate|insert|update)\b)|('--)|(--\s)|(#\s*\n)|(\bOR\b\s+'?\d+'?\s*=\s*'?\d))" \
    "id:100200,phase:2,deny,status:403,log,msg:'SQL injection pattern in parameters or body',tag:'attack-sqli',tag:'owasp-top10-a03-injection',severity:CRITICAL,t:none,t:urlDecodeUni,t:lowercase"

# 100210 - Cross-site scripting: tags, script sources, event-handler
# assignments (anchored to '=' so prose mentioning 'onclick' is ignored),
# javascript:/data: URLs and DOM sinks.
SecRule ARGS|ARGS_NAMES|REQUEST_BODY|REQUEST_URI "@rx (<script[^>]*>|javascript\s*:|data:\s*text/html|</script>|<iframe[^>]*>|on(load|error|click|mouse|focus|blur|submit|change|keyup|keydown|input|scroll|resize|unload|beforeunload)\s*=|document\.(cookie|location|write)|alert\s*\()" \
    "id:100210,phase:2,deny,status:403,log,msg:'Cross-site scripting (XSS) payload detected',tag:'attack-xss',tag:'owasp-top10-a03-injection',severity:CRITICAL,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase"

# 100220 - OS command injection: command substitution forms and chained /
# piped shell commands. The semicolon and pipe branches require a following
# word character so ordinary strings are not flagged.
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (\$\([^)]*\)|`[^`]+`|(;\s*[a-zA-Z_])|(\|\s*[a-zA-Z_]))" \
    "id:100220,phase:2,deny,status:403,log,msg:'OS command injection pattern detected',tag:'attack-rce',tag:'owasp-top10-a03-injection',severity:CRITICAL,t:none,t:urlDecodeUni"

# 100230 - Path traversal / absolute-system-path probes inside parameters
# (e.g. template=../../../etc/passwd).
SecRule ARGS|ARGS_NAMES "@rx ((^|/)\.\.(/|$|\?|#|%2[fF]|%5[cC])|(//)*(etc|proc|windows)(/|$|%2[fF])|(^[a-zA-Z]:\\(windows|program files))|(%00))" \
    "id:100230,phase:2,deny,status:403,log,msg:'Path traversal / file inclusion attempt in parameter',tag:'attack-lfi',severity:CRITICAL,t:none,t:urlDecodeUni"

# 100240 - Server-side request forgery probes: loopback, link-local, IPv6
# loopback and file/gopher/dict schemes passed as parameter values.
SecRule ARGS "@rx (?i)\b(127\.0\.0\.1|localhost|0\.0\.0\.0|::1|169\.254\.[0-9]{1,3}\.[0-9]{1,3}|file://|gopher://|dict://|ftp://)\b" \
    "id:100240,phase:2,deny,status:403,log,msg:'SSRF / internal-target probe in parameter',tag:'attack-ssrf',severity:CRITICAL,t:none,t:urlDecodeUni,t:lowercase"

# 100250 - Sensitive file / config names disclosed via parameters
# (e.g. config=wp-config.php&path=.git).
SecRule ARGS "@rx (?i)(^|/|\.)((\.env|\.git/?|\.svn|wp-config\.php|web\.config|\.htaccess|/etc/passwd)(/|$|\.|\?))" \
    "id:100250,phase:2,deny,status:403,log,msg:'Sensitive file reference disclosed in parameter',tag:'sensitive-file',severity:WARNING,t:none,t:urlDecodeUni,t:lowercase"

# 100260 - Known attack-scanner user agents (request-blocking scanners).
# WARNING severity because this is reputation-based; still denied to stop
# automated enumeration. Legitimate browsers/crawlers do not match.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|masscan|acunetix|netsparker|nessus|dirbuster|wfuzz|havij|openvas|burpsuite|zap)" \
    "id:100260,phase:1,deny,status:403,log,msg:'Request from a known vulnerability scanner',tag:'reputation-scanner',severity:WARNING,t:none,t:lowercase"

# 100270 - Cookie header carrying active XSS/script or command-substitution
# payloads (a common second-order injection vector).
SecRule REQUEST_HEADERS:Cookie "@rx (<script[^>]*>|\$\([^)]*\)|`\w+`|;\s*[a-zA-Z_])" \
    "id:100270,phase:1,deny,status:403,log,msg:'Malicious payload detected in Cookie header',tag:'attack-injection',severity:CRITICAL,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase"

SecMarker END_PHASE2_BODY_ARGS
SecMarker END_STANDALONE_RULESET
